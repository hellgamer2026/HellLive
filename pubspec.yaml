name: hell_live
description: HELL LIVE - Aplicativo de alertas e leitura de lives em tempo real.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  socket_io_client: ^2.0.3+1
  flutter_tts: ^4.0.2
  shared_preferences: ^2.2.3
  file_picker: ^8.0.0+1
  audioplayers: ^6.1.0
  http: ^1.2.1
  url_launcher: ^6.2.5
  local_auth: ^2.3.0
  wakelock_plus: ^1.2.8
  google_sign_in: ^6.2.1
  record: ^5.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "icon.png"
  windows:
    generate: true
    image_path: "icon.png"

flutter:
  uses-material-design: true
  assets:
    - icon.png


