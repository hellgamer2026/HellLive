name: Build HellLive APK e Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Preparar estrutura Android e compilar APK
        run: |
          flutter create --platforms=android .
          flutter pub get
          flutter build apk --release
      - name: Guardar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: HellLive-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Preparar estrutura Windows e compilar EXE
        run: |
          flutter create --platforms=windows .
          flutter pub get
          flutter build windows --release
      - name: Guardar App Windows para Download
        uses: actions/upload-artifact@v4
        with:
          name: HellLive-Windows-PC
          path: build/windows/x64/runner/Release/
