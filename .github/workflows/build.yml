name: Build HELL LIVE APK e Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Preparar Android, Aplicar Ícone e Compilar APK
        run: |
          flutter create --platforms=android --project-name hell_live .
          sed -i 's/android:label="hell_live"/android:label="HELL LIVE"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts || true
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle || true
          sed -i 's/flutter.minSdkVersion/23/g' android/app/build.gradle.kts || true
          sed -i 's/flutter.minSdkVersion/23/g' android/app/build.gradle || true
          cat << 'EOF' >> android/build.gradle.kts
          subprojects {
              afterEvaluate {
                  if (project.hasProperty("android")) {
                      project.extensions.configure<com.android.build.gradle.BaseExtension>("android") {
                          compileSdkVersion(36)
                      }
                  }
              }
          }
          EOF
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release
      - name: Guardar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: HELL-LIVE-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Preparar Windows, Aplicar Ícone e Compilar EXE
        run: |
          flutter create --platforms=windows --project-name hell_live .
          flutter pub get
          dart run flutter_launcher_icons
          flutter build windows --release
      - name: Guardar App Windows para Download
        uses: actions/upload-artifact@v4
        with:
          name: HELL-LIVE-Windows-PC
          path: build/windows/x64/runner/Release/
