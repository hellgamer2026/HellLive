name: Build HELL LIVE APK e Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Preparar Android, Enquadrar Ícone e Compilar APK
        run: |
          flutter create --platforms=android --project-name hell_live .
          sed -i 's/android:label="hell_live"/android:label="HELL Live"/g' android/app/src/main/AndroidManifest.xml
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "flutter.minSdkVersion=23" >> android/local.properties
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts || true
          sed -i 's/flutter.minSdkVersion/23/g' android/app/build.gradle.kts || true
          cat << 'EOF' > android/build.gradle.kts
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          val newBuildDir: Directory = rootProject.layout.buildDirectory.dir("../../build").get()
          rootProject.layout.buildDirectory.value(newBuildDir)

          subprojects {
              val newSubprojectBuildDir: Directory = newBuildDir.dir(project.name)
              project.layout.buildDirectory.value(newSubprojectBuildDir)
              afterEvaluate {
                  if (project.hasProperty("android")) {
                      project.extensions.configure<com.android.build.gradle.BaseExtension>("android") {
                          compileSdkVersion(36)
                          lintOptions {
                              isCheckReleaseBuilds = false
                              isAbortOnError = false
                          }
                      }
                  }
              }
          }

          tasks.register<Delete>("clean") {
              delete(rootProject.layout.buildDirectory)
          }
          EOF
          sudo apt-get update && sudo apt-get install -y python3-pil
          python3 -c "from PIL import Image, ImageDraw; img = Image.open('icon.png').convert('RGBA'); px = [(r, g, b, 0) if (r < 25 and g < 25 and b < 35) else (r, g, b, a) for r, g, b, a in img.getdata()]; img.putdata(px); bg = Image.new('RGBA', (1024, 1024), (7, 20, 54, 255)); glow = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0)); draw = ImageDraw.Draw(glow); [draw.ellipse([512-r, 512-r, 512+r, 512+r], fill=(30, 120, 255, int(110*(1-r/420)))) for r in range(420, 0, -8)]; bg = Image.alpha_composite(bg, glow); fg = img.resize((620, 620)); bg.paste(fg, (202, 202), fg); bg.save('icon_tablet.png')"
          sed -i 's/adaptive_icon_background: "#000000"/adaptive_icon_background: "#071436"/g' pubspec.yaml
          sed -i 's/adaptive_icon_foreground: "icon.png"/adaptive_icon_foreground: "icon_tablet.png"/g' pubspec.yaml
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release
      - name: Guardar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: HELL-LIVE-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Preparar Windows, Aplicar Ícone e Compilar EXE
        run: |
          flutter create --platforms=windows --project-name hell_live .
          flutter pub get
          dart run flutter_launcher_icons
          flutter build windows --release
      - name: Guardar App Windows para Download
        uses: actions/upload-artifact@v4
        with:
          name: HELL-LIVE-Windows-PC
          path: build/windows/x64/runner/Release/
